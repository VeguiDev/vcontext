name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - "apps/landing/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this manually triggered build
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      tag: ${{ steps.release-version.outputs.tag }}
      prerelease: ${{ steps.release-version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release-version
        env:
          VCONTEXT_BUILD_NUMBER: ${{ github.run_number }}
        run: bun scripts/resolve-release-version.ts "$VCONTEXT_BUILD_NUMBER"

      - name: Test release tooling
        run: bun test scripts/resolve-release-version.test.ts scripts/build-release.test.ts

      - name: Lint, typecheck, and test
        run: pnpm lint && pnpm check-types && pnpm -r --if-present test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            executable: release/bin/vcontext-linux-x64
            bun_asset: bun-linux-x64-baseline
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            executable: release/bin/vcontext-linux-arm64
            bun_asset: ""
          - runner: macos-15-intel
            target: darwin-x64
            executable: release/bin/vcontext-darwin-x64
            bun_asset: ""
          - runner: macos-15
            target: darwin-arm64
            executable: release/bin/vcontext-darwin-arm64
            bun_asset: ""
          - runner: windows-latest
            target: windows-x64
            executable: release/bin/vcontext-windows-x64.exe
            bun_asset: bun-windows-x64-baseline
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up baseline Bun
        if: matrix.bun_asset != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          bun-download-url: ${{ format('https://github.com/oven-sh/bun/releases/download/bun-v{0}/{1}.zip', env.BUN_VERSION, matrix.bun_asset) }}

      - name: Set up Bun
        if: matrix.bun_asset == ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@app/cli...

      - name: Build standalone executable
        env:
          VCONTEXT_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: bun scripts/build-release.ts ${{ matrix.target }}

      - name: Smoke test native executable
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: bun scripts/smoke-standalone.ts "$EXECUTABLE" "$EXPECTED_VERSION"

      - name: Upload native executable
        uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.target }}
          path: release/bin/*
          if-no-files-found: error
          retention-days: 1

  package:
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download native executables
        uses: actions/download-artifact@v5
        with:
          path: release/bin
          merge-multiple: true

      - name: Package release assets and checksums
        run: sh scripts/package-release.sh release/bin release/assets

      - name: Verify complete release asset set
        shell: bash
        run: |
          test "$(find release/assets -maxdepth 1 -type f | wc -l)" -eq 6
          test -f release/assets/vcontext-checksums.txt

      - name: Upload packaged release assets
        uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: release/assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - verify
      - package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: release/assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: vcontext ${{ needs.verify.outputs.version }}
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/assets/*
