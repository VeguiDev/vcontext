name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - "apps/landing/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this manually triggered build
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      tag: ${{ steps.release-version.outputs.tag }}
      prerelease: ${{ steps.release-version.outputs.prerelease }}
      base-version: ${{ steps.release-version.outputs.base-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release-version
        env:
          VCONTEXT_BUILD_NUMBER: ${{ github.run_number }}
        run: bun scripts/resolve-release-version.ts "$VCONTEXT_BUILD_NUMBER"

      - name: Test release tooling
        run: bun test scripts/resolve-release-version.test.ts scripts/build-release.test.ts

      - name: Lint, typecheck, and test
        run: pnpm lint && pnpm check-types && pnpm -r --if-present test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            executable: release/bin/vcontext-linux-x64
            bun_asset: bun-linux-x64-baseline
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            executable: release/bin/vcontext-linux-arm64
            bun_asset: ""
          - runner: macos-15-intel
            target: darwin-x64
            executable: release/bin/vcontext-darwin-x64
            bun_asset: ""
          - runner: macos-15
            target: darwin-arm64
            executable: release/bin/vcontext-darwin-arm64
            bun_asset: ""
          - runner: windows-latest
            target: windows-x64
            executable: release/bin/vcontext-windows-x64.exe
            bun_asset: bun-windows-x64-baseline
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up baseline Bun
        if: matrix.bun_asset != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          bun-download-url: ${{ format('https://github.com/oven-sh/bun/releases/download/bun-v{0}/{1}.zip', env.BUN_VERSION, matrix.bun_asset) }}

      - name: Set up Bun
        if: matrix.bun_asset == ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=vcontext...

      - name: Build standalone executable
        env:
          VCONTEXT_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: bun scripts/build-release.ts ${{ matrix.target }}

      - name: Smoke test native executable
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: bun scripts/smoke-standalone.ts "$EXECUTABLE" "$EXPECTED_VERSION"

      - name: Upload native executable
        uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.target }}
          path: release/bin/*
          if-no-files-found: error
          retention-days: 1

  package:
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download native executables
        uses: actions/download-artifact@v5
        with:
          path: release/bin
          merge-multiple: true

      - name: Package release assets and checksums
        run: sh scripts/package-release.sh release/bin release/assets

      - name: Verify complete release asset set
        shell: bash
        run: |
          test "$(find release/assets -maxdepth 1 -type f | wc -l)" -eq 6
          test -f release/assets/vcontext-checksums.txt

      - name: Upload packaged release assets
        uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: release/assets/*
          if-no-files-found: error
          retention-days: 7

  npm-package:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tarball-filename: ${{ steps.pack.outputs.tarball-filename }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm bundles
        run: pnpm --filter vcontext run build:npm

      - name: Pack and dry-run
        id: pack
        shell: bash
        run: |
          cd apps/cli
          npm pack --json > pack-result.json
          TARBALL=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('pack-result.json','utf8'))[0].filename)")
          echo "tarball-filename=$TARBALL" >> "$GITHUB_OUTPUT"
          npm publish --dry-run --json || echo "dry-run completed (expected for first publish)"

      - name: Run npm smoke test
        shell: bash
        run: >
          bun scripts/smoke-npm-package.ts
          --tarball "apps/cli/${{ steps.pack.outputs.tarball-filename }}"
          "${{ needs.verify.outputs.version }}"

      - name: Upload npm tarball
        uses: actions/upload-artifact@v5
        with:
          name: npm-tarball
          path: apps/cli/${{ steps.pack.outputs.tarball-filename }}
          if-no-files-found: error
          retention-days: 7

  npm-smoke:
    needs: npm-package
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download npm tarball
        uses: actions/download-artifact@v5
        with:
          name: npm-tarball
          path: npm-tarball

      - name: Smoke test installed tarball
        shell: bash
        run: >
          bun scripts/smoke-npm-package.ts
          --tarball "npm-tarball/${{ needs.npm-package.outputs.tarball-filename }}"
          "${{ needs.verify.outputs.version }}"

  npm-publish:
    needs:
      - verify
      - npm-package
      - npm-smoke
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm tarball
        uses: actions/download-artifact@v5
        with:
          name: npm-tarball
          path: npm-tarball

      - name: Check npm registry
        id: check
        shell: bash
        env:
          BASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://registry.npmjs.org/vcontext/${BASE_VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "VERSION_EXISTS=true" >> "$GITHUB_ENV"
            echo "vcontext@${BASE_VERSION} already published — skipping"
          else
            echo "VERSION_EXISTS=false" >> "$GITHUB_ENV"
            echo "vcontext@${BASE_VERSION} not found — will publish"
          fi

      - name: Set up Node.js
        if: env.VERSION_EXISTS == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Publish to npm
        if: env.VERSION_EXISTS == 'false'
        shell: bash
        env:
          BASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          TARBALL=$(ls npm-tarball/*.tgz 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "No .tgz file found in npm-tarball/"
            exit 1
          fi
          npm publish "$TARBALL" --access public --provenance
          echo "Published vcontext@${BASE_VERSION}"

  publish:
    needs:
      - verify
      - package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: release/assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: vcontext ${{ needs.verify.outputs.version }}
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/assets/*
